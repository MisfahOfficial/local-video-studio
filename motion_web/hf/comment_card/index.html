<!doctype html>
<html><head><meta charset="utf-8">
<script src="gsap.min.js"></script>
<style>
  html,body{margin:0}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden}
  #bg{position:absolute;inset:0}
  #bubble{position:absolute;left:260px;top:170px;width:1400px;height:660px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  #tail{position:absolute;left:420px;top:820px;width:0;height:0;border-left:40px solid transparent;border-right:80px solid transparent;border-top:110px solid}
  .avatar{position:absolute;width:64px;height:64px;border-radius:50%;opacity:.85}
  .word{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
</style></head>
<body>
<div id="stage" data-composition-id="comment_card" data-start="0" data-width="1920" data-height="1080" data-duration="4"
     data-composition-variables='{"payload":{"type":"string","default":"{}"}}'>
  <div id="bg" class="clip" data-start="0" data-duration="600" data-track-index="0"></div>
  <div id="card" class="clip" data-start="0" data-duration="600" data-track-index="1"><div id="bubble"></div><div id="tail"></div></div>
  <div id="words" class="clip" data-start="0" data-duration="600" data-track-index="2"></div>
</div>
<script>
  const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const p = JSON.parse(vars.payload || "{}");
  const seconds = p.seconds || 4, k = Math.min(1, seconds / 4);
  document.getElementById("bg").style.background = `radial-gradient(circle at 50% 40%, ${p.bg_inner}, ${p.bg_outer})`;
  document.getElementById("bubble").style.background = p.card;
  document.getElementById("tail").style.borderTopColor = p.card;
  const card = document.getElementById("card");
  [0, 1, 2].forEach(i => { const a = document.createElement("div"); a.className = "avatar";
    a.style.cssText += `left:${1500 + i * 44}px;top:880px;background:${[p.accent, p.ink, p.bg_inner][i]};border:4px solid ${p.card}`; card.appendChild(a); });
  const tl = gsap.timeline({paused: true});
  tl.from("#bubble", {scale: 0.6, opacity: 0, transformOrigin: "20% 100%", duration: 0.4 * k, ease: "back.out(1.6)"}, 0);
  tl.from("#tail", {opacity: 0, duration: 0.2 * k}, 0.2 * k);
  tl.from(".avatar", {y: 40, opacity: 0, stagger: 0.12 * k, duration: 0.3 * k}, 0.6 * k);
  if (p.show_text) {
    (p.texts || []).forEach((t, i) => {
      const el = document.createElement("div"); el.className = "word"; el.textContent = t.text;
      el.style.cssText += `left:${t.x}px;top:${t.y}px;font-size:${t.size}px;font-family:${t.font};color:${t.color};letter-spacing:${t.spacing || 0}px`;
      document.getElementById("words").appendChild(el);
      tl.from(el, {opacity: 0, y: 16, duration: 0.3 * k}, (0.3 + i * 0.12) * k);
    });
  }
  window.__timelines = window.__timelines || {}; window.__timelines.comment_card = tl;
</script>
</body></html>
