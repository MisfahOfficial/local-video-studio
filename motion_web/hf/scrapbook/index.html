<!doctype html>
<html><head><meta charset="utf-8">
<script src="gsap.min.js"></script>
<style>
  html,body{margin:0}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;
         background:#c9a574;background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:9px 9px}
  #edge{position:absolute;inset:0;box-shadow:inset 0 0 180px rgba(70,40,10,.55)}
  .photo{position:absolute;background:#fbf7ee;padding:14px 14px 18px;box-shadow:0 14px 28px rgba(40,20,0,.45)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) sepia(.15)}
  .tape{position:absolute;width:150px;height:44px;left:50%;top:-18px;margin-left:-75px;background:rgba(236,200,120,.75);transform:rotate(-6deg)}
  .word{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#3a2412}
  .arrow{position:absolute;width:120px;height:4px;background:#3a2412;border-radius:2px}
</style></head>
<body>
<div id="stage" data-composition-id="scrapbook" data-start="0" data-width="1920" data-height="1080" data-duration="4"
     data-composition-variables='{"payload":{"type":"string","default":"{}"}}'>
  <div id="layer" class="clip" data-start="0" data-duration="600" data-track-index="0"></div>
  <div id="edge" class="clip" data-start="0" data-duration="600" data-track-index="1"></div>
</div>
<script>
  const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const p = JSON.parse(vars.payload || "{}");
  const seconds = p.seconds || 4, k = Math.min(1, seconds / 4);
  const layer = document.getElementById("layer");
  const tl = gsap.timeline({paused: true});
  const size = p.photo_size || 330;
  tl.fromTo("#stage", {backgroundPositionX: "0px"}, {backgroundPositionX: "30px", duration: seconds, ease: "none"}, 0);
  if (p.show_text && p.heading) {
    const h = document.createElement("div"); h.className = "word"; h.textContent = p.heading;
    h.style.cssText += `left:${p.heading_x}px;top:${p.heading_y}px;font-size:90px;font-family:Noteworthy;color:#8c2f1c`;
    layer.appendChild(h); tl.from(h, {rotation: -8, opacity: 0, duration: 0.4 * k}, 0.05 * k);
  }
  (p.items || []).forEach((item, i) => {
    const tilt = [-7, 5, -3, 6, -5][i];
    const ph = document.createElement("div"); ph.className = "photo";
    ph.style.cssText += `left:${item.photo_x}px;top:${item.photo_y}px;width:${size}px;height:${size}px;transform:rotate(${tilt}deg)`;
    ph.innerHTML = `<img src="${item.image}"><div class="tape"></div>`;
    layer.appendChild(ph);
    tl.from(ph, {scale: 1.25, opacity: 0, rotation: tilt * 3, duration: 0.35 * k, ease: "power3.out"}, (0.2 + i * 0.3) * k);
    if (p.show_text) {
      const w = document.createElement("div"); w.className = "word"; w.textContent = item.label;
      w.style.cssText += `left:${item.text_x}px;top:${item.text_y}px;font-size:60px;font-family:Noteworthy`;
      layer.appendChild(w);
      tl.from(w, {clipPath: "inset(0 100% 0 0)", duration: 0.4 * k, ease: "none"}, (0.4 + i * 0.3) * k);
    }
  });
  window.__timelines = window.__timelines || {}; window.__timelines.scrapbook = tl;
</script>
</body></html>
