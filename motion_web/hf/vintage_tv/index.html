<!doctype html>
<html><head><meta charset="utf-8">
<script src="gsap.min.js"></script>
<style>
  html,body{margin:0}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#5a3b22,#1c120a)}
  #tv{position:absolute;left:300px;top:110px;width:1320px;height:860px;border-radius:60px;background:linear-gradient(#8a5a33,#5b3a1f);
      box-shadow:0 40px 80px rgba(0,0,0,.6), inset 0 0 0 14px #3a2412}
  #screen{position:absolute;left:410px;top:170px;width:1100px;height:640px;border-radius:70px/50px;overflow:hidden;background:#111;
          box-shadow:inset 0 0 90px rgba(0,0,0,.9)}
  #photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:sepia(.4) contrast(1.1) brightness(.55)}
  #lines{position:absolute;inset:0;background:repeating-linear-gradient(rgba(0,0,0,.35) 0 2px,transparent 2px 5px)}
  #static{position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 60%,#fff 0 1px,#000 1px 3px);opacity:0}
  .knob{position:absolute;width:70px;height:70px;border-radius:50%;background:#2a1a0c;box-shadow:inset 0 0 0 8px #c9a36a}
  .word{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 0 18px rgba(170,255,190,.45)}
</style></head>
<body>
<div id="stage" data-composition-id="vintage_tv" data-start="0" data-width="1920" data-height="1080" data-duration="4"
     data-composition-variables='{"payload":{"type":"string","default":"{}"}}'>
  <div id="tv" class="clip" data-start="0" data-duration="600" data-track-index="0"></div>
  <div id="screen" class="clip" data-start="0" data-duration="600" data-track-index="1">
    <div id="photo"></div><div id="lines"></div><div id="static"></div>
  </div>
  <div id="knobs" class="clip" data-start="0" data-duration="600" data-track-index="2">
    <div class="knob" style="left:1530px;top:860px"></div><div class="knob" style="left:320px;top:860px"></div>
  </div>
  <div id="words" class="clip" data-start="0" data-duration="600" data-track-index="3"></div>
</div>
<script>
  const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const p = JSON.parse(vars.payload || "{}");
  const seconds = p.seconds || 4, k = Math.min(1, seconds / 4);
  if (p.background) document.getElementById("photo").style.backgroundImage = `url(${p.background})`;
  const tl = gsap.timeline({paused: true});
  tl.set("#static", {opacity: 0.9}, 0);                      // channel switch: static, then the picture
  tl.to("#static", {opacity: 0, duration: 0.35 * k}, 0.15 * k);
  tl.from("#screen", {scaleY: 0.02, duration: 0.25 * k, ease: "power2.out"}, 0);
  tl.to("#lines", {backgroundPositionY: "+=40px", duration: seconds, ease: "none"}, 0);
  if (p.show_text) {
    (p.texts || []).forEach((t, i) => {
      const el = document.createElement("div"); el.className = "word"; el.textContent = t.text;
      el.style.cssText += `left:${t.x}px;top:${t.y}px;font-size:${t.size}px;font-family:${t.font};color:${t.color};letter-spacing:${t.spacing || 0}px`;
      document.getElementById("words").appendChild(el);
      tl.from(el, {opacity: 0, scaleX: 1.4, filter: "blur(6px)", duration: 0.35 * k}, (0.45 + i * 0.2) * k);
    });
  }
  window.__timelines = window.__timelines || {}; window.__timelines.vintage_tv = tl;
</script>
</body></html>
