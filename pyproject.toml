[project]
name = "local-video-studio"
version = "0.6.6"
description = "Local-first bulk image-to-video production studio"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.8.30"]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1.0"]
packaging = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["static/*.css", "static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
