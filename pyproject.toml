[project]
name = "local-video-studio"
version = "0.7.2"
description = "Local-first bulk image-to-video production studio"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.8.30", "yt-dlp>=2025.1.15"]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1.0"]
visual-match = ["torch>=2.2", "open_clip_torch>=2.24", "pillow>=10"]
ai-judge = ["anthropic>=1.8"]
text-guard = ["pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]
packaging = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["static/*.css", "static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
